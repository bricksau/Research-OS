[project]
name = "research-os"
version = "2.1.0"
description = "Question-driven Research Intelligence Operating System for Empirical Economics and Social Sciences"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Quan ZHUANG", email = "bricksau@users.noreply.github.com" }
]
dependencies = [
    "pyyaml>=6.0.1",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.black]
line-length = 88
